name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The Gemfile references ragdoll and ragdoll-rails by sibling path
      - name: Check out ragdoll gems referenced by path
        run: |
          git clone --depth 1 --branch v0.1.12 https://github.com/MadBomber/ragdoll.git ../core
          git clone --depth 1 --branch v0.1.12 https://github.com/MadBomber/ragdoll-rails.git ../rails

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The Gemfile references ragdoll and ragdoll-rails by sibling path
      - name: Check out ragdoll gems referenced by path
        run: |
          git clone --depth 1 --branch v0.1.12 https://github.com/MadBomber/ragdoll.git ../core
          git clone --depth 1 --branch v0.1.12 https://github.com/MadBomber/ragdoll-rails.git ../rails

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The Gemfile references ragdoll and ragdoll-rails by sibling path
      - name: Check out ragdoll gems referenced by path
        run: |
          git clone --depth 1 --branch v0.1.12 https://github.com/MadBomber/ragdoll.git ../core
          git clone --depth 1 --branch v0.1.12 https://github.com/MadBomber/ragdoll-rails.git ../rails

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

